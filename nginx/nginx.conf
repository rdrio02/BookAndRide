# Per-IP zone: keep 10 MB of state (enough for many clients), allow 10 req/sec
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

server {
  listen 80;

  location / {
    limit_req zone=api burst=20;
    proxy_pass http://api:8080;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
  }

  # Fast paths
  location = /health       { proxy_pass http://api:8080; }
  location = /openapi.json { proxy_pass http://api:8080; }
  location = /docs         { proxy_pass http://api:8080; }

  # Return a friendly 429 with Retry-After
  error_page 429 = @ratelimited;
  location @ratelimited {
    add_header Retry-After 1 always;
    return 429 'Too Many Requests\n';
  }

  # If you plan bulk uploads, bump this
  client_max_body_size 5m;

}
