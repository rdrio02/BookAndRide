[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bookandride-dashboard"
version = "1.0.0"
description = "Book & Ride Streamlit Dashboard"
requires-python = ">=3.10"

dependencies = [
  "streamlit>=1.36",
  "httpx",
  "pydantic"
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
